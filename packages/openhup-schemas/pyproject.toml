[project]
name = "openhup-schemas"
version = "0.1.0"
description = "Shared wire types for OpenHup: observations, skills, tasks, metrics, personalities."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openhup_schemas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
