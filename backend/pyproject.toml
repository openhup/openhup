[project]
name = "openhup-backend"
version = "0.1.0"
description = "OpenHup API, skill engine, task/alert/metric state, LLM gateway and notifications."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "openhup-schemas",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "python-multipart>=0.0.20",
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
# Postgres is the default, but a single-camera install can run on SQLite. See ADR-007.
sqlite = ["aiosqlite>=0.20"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiosqlite>=0.20",
]

[project.scripts]
openhup-api = "openhup.api.main:run"
openhup-engine = "openhup.engine:run"
openhup-cli = "openhup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openhup"]

[tool.uv.sources]
openhup-schemas = { path = "../packages/openhup-schemas", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:openhup.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection style *requires* calls in argument defaults
# (Body(...), Query(...), Depends(...)). B008 is a false positive for router modules.
"openhup/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
# The engine's pure core is fully typed; adapters that touch third-party stubs are relaxed.
[[tool.mypy.overrides]]
module = ["openhup.notify.*", "openhup.db.migrations.*"]
disallow_untyped_defs = false
